name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Check site
        run: npm run check

      - name: Run unit and content tests
        run: npm test

      - name: Build site
        run: npm run build
        env:
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Audit terminal scroll smoke
        timeout-minutes: 5
        run: npm run audit:terminal:ci

      - name: Audit living cell background smoke
        timeout-minutes: 5
        run: npm run audit:cells:ci

      - name: Audit variant playground smoke
        timeout-minutes: 5
        run: npm run audit:playground:ci

      - name: Audit indexing
        run: npm run audit:indexing

      - name: Audit deep-dive references and datasets
        run: npm run audit:refs:offline && npm run audit:datasets:offline

      - name: Audit ML interview curriculum
        run: npm run audit:ml-interview

      - name: Audit deep-dive UI smoke (Chromium and WebKit)
        timeout-minutes: 12
        run: npm run audit:deep-dives:ci

      - name: Audit built links
        run: npm run audit:links

      - name: Audit security
        run: npm run audit:security

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
