name: Comprehensive site audit (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check site
        run: npm run check
      - name: Run unit and content tests
        run: npm test
      - name: Build site
        run: npm run build
        env:
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      - name: Audit indexing
        run: npm run audit:indexing
      - name: Test game audit lifecycle and interaction regressions
        timeout-minutes: 3
        run: npm run test:game-audit-runtime
      - name: Audit game controls and lifecycle (Chromium and WebKit)
        timeout-minutes: 12
        run: npm run audit:games:ci
      - name: Upload game audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-ui-audit
          path: /tmp/khc-game-ui/
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit software listing and game icons
        timeout-minutes: 6
        run: npm run audit:software
      - name: Upload software listing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: software-ui-audit
          path: /tmp/khc-software-ui-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit terminal scroll smoke
        timeout-minutes: 5
        run: npm run audit:terminal:ci
      - name: Audit living cell background smoke
        timeout-minutes: 5
        run: npm run audit:cells:ci
      # Slow headless WebKit animation frames need a generous hang guard.
      - name: Audit switchable backgrounds
        timeout-minutes: 20
        run: npm run audit:background:ci
      - name: Audit motif finale across browsers
        timeout-minutes: 10
        run: npm run audit:motif:ci
      - name: Upload motif finale evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motif-finale-audit
          path: /tmp/khc-motif-finale-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload background animation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: background-animation-audit
          path: /tmp/khc-background-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit variant playground smoke
        timeout-minutes: 12
        run: npm run audit:playground:ci
      - name: Audit genome browser in Firefox and WebKit
        timeout-minutes: 10
        run: npm run audit:genome:ci -- --browsers firefox,webkit
      - name: Upload genome audit failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: genome-browser-audit
          path: /tmp/genome-audit/
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit educational algorithms across browsers
        timeout-minutes: 12
        run: npm run audit:algorithms:ci
      - name: Upload algorithm lesson evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: algorithm-lesson-audit
          path: /tmp/khc-algorithms-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit deep-dive references and datasets
        run: npm run audit:refs:offline && npm run audit:datasets:offline
      - name: Audit ML interview curriculum
        run: npm run audit:ml-interview
      - name: Audit deep-dive UI smoke (Chromium and WebKit)
        timeout-minutes: 12
        run: npm run audit:deep-dives:ci
      - name: Audit built links
        run: npm run audit:links
      - name: Audit security
        run: npm run audit:security
