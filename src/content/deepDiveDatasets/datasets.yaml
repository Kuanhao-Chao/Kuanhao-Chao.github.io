# The genomic resource registry.
#
# Version numbers, sample counts and URLs are exactly the facts that go stale silently,
# and this repository has already been bitten twice by the same mechanism (reading times,
# then catalog metadata). So each resource is defined once, here, and every page renders
# it through <Dataset> or <DatasetTable> rather than re-typing it.
#
# `access` is a first-class field because it is the practical fact that decides whether a
# reader can use a resource at all, and the one most surveys omit:
#   open        — download or query without an account
#   registered  — free, but requires an account or a click-through agreement
#   controlled  — requires an application to a data access committee (dbGaP, UKB, AoU)
#   licensed    — requires a paid or institutional licence
#
# `verified` records when the version, scale and URL were last checked against the source.
# `npm run audit:datasets` re-checks the URLs and the staleness of that date.

# ── Layer 2 · Population reference baselines ──────────────────────────────────

gnomad:
  name: gnomAD
  fullName: Genome Aggregation Database
  layer: population-frequency
  url: https://gnomad.broadinstitute.org/
  version: v4.1.1
  released: 2026-03-30
  scale: "730,947 exomes + 76,215 genomes (807,162 individuals), GRCh38"
  access: open
  citationId: chen2024constraint
  note: >-
    Publishes joint exome/genome allele numbers, so callability is not silently lost when
    the two call sets disagree. The non-UK-Biobank subset exists to keep UKB out of both
    sides of an evaluation.
  verified: 2026-08-21

allofus:
  name: All of Us
  fullName: All of Us Research Program
  layer: population-frequency
  url: https://www.researchallofus.org/
  version: "Controlled Tier, v8"
  scale: "~250,000 whole genomes linked to longitudinal electronic health records"
  access: controlled
  citationId: allofus2024
  note: >-
    Deliberately over-samples populations under-represented in earlier cohorts, which is
    what makes it useful for polygenic-score portability. Analysis happens inside the
    Researcher Workbench; the data does not leave it.
  verified: 2026-08-21

thousand-genomes:
  name: 1000 Genomes
  fullName: 1000 Genomes Project (phase 3, NYGC 30x re-sequencing)
  layer: population-frequency
  url: https://www.internationalgenome.org/
  version: "Phase 3 / NYGC high-coverage"
  scale: "2,504 individuals (5,008 haplotypes) from 26 populations; 3,202 with the trios"
  access: open
  citationId: tgp2015
  note: >-
    Long past its usefulness as a frequency reference, and still the default LD and phasing
    panel because it is open, small enough to distribute, and everything is benchmarked
    against it.
  verified: 2026-08-21

topmed:
  name: TOPMed
  fullName: Trans-Omics for Precision Medicine
  layer: population-frequency
  url: https://topmed.nhlbi.nih.gov/
  version: "Freeze 8 / BRAVO"
  scale: "53,831 deeply sequenced genomes in the flagship freeze; >150,000 in later freezes"
  access: controlled
  citationId: taliun2021
  note: >-
    Individual-level data is controlled through dbGaP, but the BRAVO browser exposes
    allele frequencies openly, and the imputation server is free to use — so the practical
    access level depends entirely on which of the three you need.
  verified: 2026-08-21

hgdp:
  name: HGDP
  fullName: Human Genome Diversity Project (CEPH panel)
  layer: population-frequency
  url: https://www.internationalgenome.org/data-portal/data-collection/hgdp
  version: "gnomAD-harmonised call set"
  scale: "929 individuals from 54 geographically diverse populations"
  access: open
  citationId: bergstrom2020
  note: >-
    Small, but sampled for breadth rather than for disease, which makes it the reference
    that shows what a frequency looks like outside the handful of well-sequenced groups.
  verified: 2026-08-21

# ── Layer 1 · Reference assemblies, annotation and conservation ───────────────
#
# `version` is set only where it was actually confirmed against the source. An omitted
# version is an honest gap, not an oversight — a guessed release number is worse than none,
# because it looks checked.

grch38:
  name: GRCh38
  fullName: Genome Reference Consortium Human Build 38
  layer: reference-annotation
  url: https://www.ncbi.nlm.nih.gov/datasets/genome/GCF_000001405.40/
  version: GRCh38.p14
  scale: "~3.1 Gb primary assembly; 24 chromosomes plus unplaced scaffolds and alt loci"
  access: open
  note: >-
    Still the coordinate system essentially all clinical and population resources are
    published in, which is why it remains the default despite being demonstrably incomplete.
  verified: 2026-08-21

t2t-chm13:
  name: T2T-CHM13
  fullName: Telomere-to-Telomere CHM13 human reference
  layer: reference-annotation
  url: https://github.com/marbl/CHM13
  version: v2.0
  scale: "3.117 Gb gapless; adds ~200 Mb of sequence absent or misassembled in GRCh38"
  access: open
  citationId: nurk2022t2t
  note: >-
    Complete through centromeres, acrocentric short arms and segmental duplications. One
    haplotype from one hydatidiform mole, so it is a complete genome, not a diverse one.
  verified: 2026-08-21

hprc:
  name: HPRC pangenome
  fullName: Human Pangenome Reference Consortium draft reference
  layer: reference-annotation
  url: https://humanpangenome.org/
  scale: "47 diploid assemblies (94 haplotypes) in the draft release"
  access: open
  citationId: liao2023pangenome
  note: >-
    A graph rather than a string. Recovers variants that a single linear reference cannot
    represent, at the cost of tooling that most pipelines do not yet speak.
  verified: 2026-08-21

gencode:
  name: GENCODE
  fullName: GENCODE gene annotation
  layer: reference-annotation
  url: https://www.gencodegenes.org/human/
  version: Release 50
  scale: "78,733 genes (19,442 protein-coding); 644,292 transcripts, 278,455 protein-coding"
  access: open
  citationId: frankish2021gencode
  note: >-
    The annotation Ensembl ships and most sequence models are trained against. Its
    transcript count is the reason a c. coordinate needs an accession beside it.
  verified: 2026-08-21

ensembl:
  name: Ensembl
  fullName: Ensembl genome browser and annotation
  layer: reference-annotation
  url: https://www.ensembl.org/
  scale: "Vertebrate and non-vertebrate genomes; ENST/ENSG identifiers, REST API, BioMart"
  access: open
  citationId: dyer2025ensembl
  verified: 2026-08-21

refseq:
  name: RefSeq
  fullName: NCBI Reference Sequence collection
  layer: reference-annotation
  url: https://www.ncbi.nlm.nih.gov/refseq/
  scale: "Curated NM_/NP_ transcripts and proteins across all domains of life"
  access: open
  citationId: oleary2016refseq
  note: >-
    The other half of the annotation split. RefSeq and Ensembl disagree about transcript
    boundaries often enough that MANE exists to reconcile them.
  verified: 2026-08-21

mane:
  name: MANE
  fullName: Matched Annotation from NCBI and EMBL-EBI
  layer: reference-annotation
  url: https://www.ncbi.nlm.nih.gov/refseq/MANE/
  version: v1.5
  released: 2026-03-09
  scale: "One agreed MANE Select transcript per protein-coding gene, plus MANE Plus Clinical"
  access: open
  citationId: morales2022mane
  note: >-
    A RefSeq and an Ensembl transcript that are identical base for base across the CDS and
    the UTRs, so a c. coordinate means the same thing on both sides.
  verified: 2026-08-21

dbsnp:
  name: dbSNP
  fullName: NCBI Database of Single Nucleotide Polymorphisms
  layer: reference-annotation
  url: https://www.ncbi.nlm.nih.gov/snp/
  scale: "The rs-identifier namespace for human variation"
  access: open
  citationId: sherry2001dbsnp
  note: >-
    An rs number is an identifier, not an assertion: it records that someone submitted the
    variant, and says nothing about frequency, quality or consequence.
  verified: 2026-08-21

ucsc:
  name: UCSC Genome Browser
  fullName: UCSC Genome Browser and Table Browser
  layer: reference-annotation
  url: https://genome.ucsc.edu/
  scale: "Whole-genome alignments and conservation tracks (phyloP, phastCons) over 100+ species"
  access: open
  citationId: kent2002ucsc
  note: >-
    Also the home of liftOver, which is where most cross-assembly coordinate errors are
    introduced and where they can be caught.
  verified: 2026-08-21

zoonomia:
  name: Zoonomia
  fullName: Zoonomia comparative genomics resource
  layer: reference-annotation
  url: https://zoonomiaproject.org/
  scale: "241 placental mammal genomes aligned; per-base constraint over ~3.5% of the genome"
  access: open
  citationId: christmas2023zoonomia
  note: >-
    Deep enough phylogeny to resolve constraint at single-base resolution, which shallower
    alignments cannot do.
  verified: 2026-08-21

# ── Layer 3 · Gene constraint and intolerance ─────────────────────────────────

gnomad-constraint:
  name: gnomAD constraint
  fullName: gnomAD gene constraint metrics
  layer: constraint-intolerance
  url: https://gnomad.broadinstitute.org/downloads#v4-constraint
  version: v4.1
  scale: "Per-transcript observed/expected counts for LoF, missense and synonymous variation"
  access: open
  citationId: chen2024constraint
  note: >-
    Ships LOEUF, pLI, missense z and pext as a single table keyed by transcript. The
    per-transcript keying matters: constraint is computed against one transcript, so it
    inherits the transcript-choice problem from Layer 1.
  verified: 2026-08-21

gnomad-sv:
  name: gnomAD-SV
  fullName: gnomAD structural variation callset
  layer: constraint-intolerance
  url: https://gnomad.broadinstitute.org/downloads#v4-structural-variants
  version: v4.1
  scale: "Deletions, duplications, insertions, inversions and complex events with population frequencies"
  access: open
  citationId: collins2020sv
  note: >-
    A separate callset from the SNV data, with its own frequencies and its own resolution
    limits. Absence of an SV here is much weaker evidence than absence of an SNV.
  verified: 2026-08-21

ccr:
  name: CCR
  fullName: Constrained Coding Regions
  layer: constraint-intolerance
  url: https://s3.us-east-2.amazonaws.com/ccrs/ccr.html
  scale: "Sub-genic regions of coding sequence depleted of protein-changing variation, percentile-ranked"
  access: open
  citationId: havrilla2019ccr
  note: >-
    Constraint below the gene level. A gene can be tolerant overall while containing a
    short stretch that is not, which whole-gene metrics average away.
  verified: 2026-08-21

shet:
  name: s_het
  fullName: Heterozygous selection coefficient estimates
  layer: constraint-intolerance
  url: https://github.com/tkzeng/GeneBayes
  scale: "Per-gene posterior estimates of the fitness cost of losing one copy"
  access: open
  citationId: zeng2024shet
  note: >-
    Estimates a population-genetic parameter rather than a depletion statistic, so it is
    on a scale that means the same thing for a short gene as for a long one — which is
    exactly what LOEUF cannot offer.
  verified: 2026-08-21

# ── Layer 4 · Variant effect prediction ──────────────────────────────────────

cadd:
  name: CADD
  fullName: Combined Annotation Dependent Depletion
  layer: variant-effect-scores
  url: https://cadd.gs.washington.edu/
  version: v1.7
  scale: "Every possible SNV plus indels, GRCh37 and GRCh38; PHRED-scaled genome-wide"
  access: open
  citationId: rentzsch2019cadd
  note: >-
    Trained to separate fixed human-derived variants from simulated ones, so it learns
    depletion rather than pathogenicity. Free for non-commercial use; commercial use needs
    a licence. A PHRED of 20 means "top 1% of all possible SNVs", not "20% likely causal".
  verified: 2026-08-21

revel:
  name: REVEL
  fullName: Rare Exome Variant Ensemble Learner
  layer: variant-effect-scores
  url: https://sites.google.com/site/revelgenomics/
  scale: "Precomputed for every possible missense change in the human exome"
  access: open
  citationId: ioannidis2016revel
  note: >-
    An ensemble over thirteen component predictors. Because those components were trained
    on overlapping variant sets, REVEL correlates with them by construction — it is not an
    independent line of evidence from the tools inside it.
  verified: 2026-08-21

alphamissense:
  name: AlphaMissense
  fullName: AlphaMissense proteome-wide missense predictions
  layer: variant-effect-scores
  url: https://github.com/google-deepmind/alphamissense
  scale: "71 million missense variants across the human proteome, precomputed"
  access: open
  citationId: cheng2023alphamissense
  note: >-
    Structure-informed and trained without human clinical labels, which is what makes it
    usable on genes ClinVar has never seen. Predictions are released CC BY-NC-SA.
  verified: 2026-08-21

spliceai:
  name: SpliceAI
  fullName: SpliceAI deep-learning splice predictor
  layer: variant-effect-scores
  url: https://github.com/Illumina/SpliceAI
  scale: "Delta scores for acceptor/donor gain and loss within 50 nt (precomputed) or 10 kb (on demand)"
  access: registered
  citationId: jaganathan2019spliceai
  note: >-
    Predicts splicing from primary sequence alone, which is why it works on deep intronic
    variants no exome annotation reaches. The precomputed set is windowed; a variant outside
    the window needs the model run, and the two are not interchangeable.
  verified: 2026-08-21

esm1b-variants:
  name: ESM-1b variant effects
  fullName: Genome-wide variant effects from a protein language model
  layer: variant-effect-scores
  url: https://huggingface.co/spaces/ntranoslab/esm_variants
  scale: "~450 million missense variants over 42,000 protein isoforms"
  access: open
  citationId: brandes2023esm1b
  note: >-
    Zero-shot: the score is the model's log-likelihood ratio between the alternate and
    reference residue, with no variant labels used in training. That independence from
    ClinVar is the property that makes it worth having alongside supervised scores.
  verified: 2026-08-21

# ── Layer 4 · Multiplexed assays of variant effect ───────────────────────────
#
# Counts are deliberately absent from `scale` here. MaveDB grows continuously and its
# homepage is a client-rendered app, so any figure written down would be stale and
# unverifiable at the same time — which is the combination the registry exists to avoid.

mavedb:
  name: MaveDB
  fullName: Multiplexed Assay of Variant Effect Database
  layer: mave-assays
  url: https://www.mavedb.org/
  scale: "Score sets from published multiplexed assays, with per-variant scores, counts and assay metadata"
  access: open
  citationId: esposito2019mavedb
  note: >-
    The repository, not an assay. Its value is that scores arrive with the target sequence,
    the scoring model and the raw counts attached, so a score can be recalibrated rather
    than only re-read.
  verified: 2026-08-21

brca1-sge:
  name: BRCA1 SGE
  fullName: Saturation genome editing of BRCA1
  layer: mave-assays
  url: https://www.mavedb.org/score-sets/urn:mavedb:00000097-0-1/
  scale: "~4,000 SNVs across 13 exons encoding the RING and BRCT domains, edited in situ"
  access: open
  citationId: findlay2018sge
  note: >-
    Edits the endogenous locus by homology-directed repair rather than expressing a
    construct, so the variant is read in its own promoter, splicing and chromatin context.
    That is what makes it evidence about the gene rather than about a plasmid.
  verified: 2026-08-21

splicevardb:
  name: SpliceVarDB
  fullName: Database of experimentally validated human splicing variants
  layer: mave-assays
  url: https://splicevardb.org/
  scale: "Human splicing variants with published experimental validation, graded by assay type"
  access: open
  citationId: sullivan2024splicevardb
  note: >-
    A truth set rather than a predictor, which is what makes it usable for calibrating
    splicing models instead of only for looking variants up.
  verified: 2026-08-21

mpra-satmut:
  name: MPRA saturation mutagenesis
  fullName: Saturation mutagenesis of disease-associated regulatory elements
  layer: mave-assays
  url: https://www.mavedb.org/
  scale: "Twenty promoters and enhancers, every possible SNV assayed for transcriptional output"
  access: open
  citationId: kircher2019mpra
  note: >-
    The non-coding counterpart to deep mutational scanning. It measures transcriptional
    output from an episomal reporter, so it establishes that a sequence *can* drive
    expression — not that it does so at its native locus.
  verified: 2026-08-21
