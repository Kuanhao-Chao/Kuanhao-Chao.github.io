  - id: q-vision-cnn-versus-vit
    question: 'Compare the inductive biases and scaling behavior of CNNs and vision Transformers.'
    conciseAnswer: >-
      CNNs hard-code locality and translation-shared filters, so they are parameter-efficient and often data-efficient; a basic ViT turns patches into tokens and learns global content-dependent interactions with weaker spatial priors. Full attention scales quadratically in token count, while convolution scales roughly linearly in pixels for fixed kernels. Data, resolution, latency, pretraining, and dense-output needs—not novelty—should drive the choice, and hybrids blur the boundary.
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: trade-off
    round: system-design
    stability: evergreen
    tags: [vision-transformer, cnn, inductive-bias]
    aliases: [ViT versus CNN, convolution versus attention]
  - id: q-vision-contrastive-learning
    question: 'How does contrastive visual representation learning work, and why are augmentations central?'
    conciseAnswer: >-
      Two views of one image form a positive pair, while other images provide negatives; an InfoNCE-style objective raises positive similarity relative to alternatives. Augmentations define which information the representation should discard, so overly weak views permit shortcuts and overly strong views can destroy class information. Batch composition, temperature, projection head, false negatives, and linear-probe versus fine-tune evaluation all affect the conclusion.
    priority: common
    difficulty: advanced
    roles: [applied-scientist, research-scientist, dl-specialist]
    kind: mathematics
