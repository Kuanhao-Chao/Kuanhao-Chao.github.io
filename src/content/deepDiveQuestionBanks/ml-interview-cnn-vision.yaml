    aliases: [non maximum suppression, bounding box overlap]
  - id: q-vision-segmentation-metrics
    question: 'How do semantic, instance, and panoptic segmentation differ, and how should they be evaluated?'
    conciseAnswer: >-
      Semantic segmentation assigns a class per pixel; instance segmentation separates individual countable objects; panoptic segmentation unifies instance-aware things with amorphous stuff. Pixel accuracy can hide rare-class failure, so report per-class IoU or Dice and macro summaries; instance tasks need matching-aware average precision, while panoptic quality combines recognition and mask overlap.
    priority: common
    difficulty: intermediate
    roles: [applied-scientist, research-scientist, dl-specialist]
    kind: concept
