    aliases: [image augmentation policy, label preserving transforms]
  - id: q-vision-detection-iou-nms
    question: 'Explain IoU, confidence thresholds, and non-maximum suppression in object detection.'
    conciseAnswer: >-
      Intersection over union is intersection area divided by union area and measures localization overlap. A detector first filters low-score candidates, then NMS repeatedly keeps a high-score box and suppresses overlapping same-class boxes above an IoU threshold. Score and NMS thresholds jointly trade recall, duplicate predictions, and crowded-object errors, so tune them on deployment-like validation data rather than treating 0.5 as universal.
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, dl-specialist]
    kind: implementation
