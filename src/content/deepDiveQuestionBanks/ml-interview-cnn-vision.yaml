lesson: ml-interview-cnn-vision
questions:
  - id: q-vision-convolution-shapes
    question: 'Derive the output shape, parameter count, and compute of a two-dimensional convolution.'
    conciseAnswer: >-
      For input B by C_in by H by W, kernel K_h by K_w, padding P, dilation D, stride S, and C_out filters, each spatial output is floor((H+2P-D(K_h-1)-1)/S+1), with the analogous width. Parameters are C_out(C_in K_h K_w+1) with bias, independent of image size, while direct multiply-accumulate cost scales with B H_out W_out C_out C_in K_h K_w.
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: mathematics
    round: coding
    stability: evergreen
    tags: [convolution, tensor-shapes, parameter-count]
    aliases: [conv2d output size, convolution dimensions]
  - id: q-vision-equivariance-invariance
    question: 'What are translation equivariance and invariance, and which CNN operations provide them?'
    conciseAnswer: >-
      A map is translation equivariant when shifting the input shifts its feature map, while a prediction is invariant when the output does not change. Shared convolution is approximately equivariant away from boundaries and sampling artifacts; pooling, striding, augmentation, and global aggregation can encourage local tolerance or final invariance, but none guarantees invariance to scale, rotation, cropping, or every discrete shift.
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: concept
    round: knowledge
    stability: evergreen
    tags: [equivariance, invariance, inductive-bias]
    aliases: [translation invariance, weight sharing]
  - id: q-vision-receptive-field
    question: 'How do you calculate a CNN receptive field, and why can the effective field be smaller?'
    conciseAnswer: >-
      Track jump j and receptive field r from the input: for layer l with kernel k, dilation d, and stride s, r_l=r_(l-1)+(k-1)d j_(l-1) and j_l=s j_(l-1). This theoretical field lists pixels connected by the graph; learned gradient influence is often concentrated near its center, and padding, downsampling, nonlinearities, or weak training signal can make the useful context smaller.
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: mathematics
    round: knowledge
    stability: evergreen
    tags: [receptive-field, dilation, stride]
    aliases: [CNN context size, effective receptive field]
  - id: q-vision-residual-networks
    question: 'Why do residual connections help deep vision networks, and what can still go wrong?'
    conciseAnswer: >-
      A residual block returns x+F(x), making an identity transformation easy and giving gradients an additive route through depth. This addresses optimization degradation rather than proving that every deeper model generalizes better; mismatched shapes need projections, and normalization placement, activation scale, stochastic depth, initialization, or an oversized residual branch can still destabilize training.
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: concept
    round: knowledge
    stability: evergreen
    tags: [resnet, skip-connections, gradient-flow]
    aliases: [residual learning, skip connections]
  - id: q-vision-transfer-learning
    question: 'When should you freeze, partially fine-tune, or fully fine-tune a pretrained vision model?'
    conciseAnswer: >-
      Freeze the backbone for a fast low-variance baseline when labels are scarce and source and target images are similar; unfreeze later blocks when higher-level features differ; fully fine-tune with smaller learning rates when enough representative data and compute justify adaptation. Validate each regime, handle normalization statistics deliberately, and remember that pretraining can transfer source bias or spurious shortcuts along with useful features.
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: trade-off
    round: experimentation
    stability: evergreen
    tags: [transfer-learning, fine-tuning, pretraining]
    aliases: [freeze backbone, linear probing]
  - id: q-vision-augmentation
    question: 'How do you choose image augmentations without corrupting the learning problem?'
    conciseAnswer: >-
      Encode transformations under which the label and deployment task should remain valid, then apply the identical geometry to images and structured targets such as boxes or masks. Tune strength on held-out data, inspect transformed samples, and separate invariance-inducing augmentation from realistic nuisance simulation; a horizontal flip can be valid for animals yet wrong for text, laterality, or directional signs.
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, dl-specialist]
    kind: trade-off
