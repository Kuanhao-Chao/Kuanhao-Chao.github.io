    aliases: [self supervised vision, positive pairs]
  - id: q-vision-small-data-system
    question: 'Design a vision baseline when labeled data are scarce and images are high resolution.'
    conciseAnswer: >-
      Start with leakage-safe patient, scene, or source-level splits; a pretrained backbone; input resolution justified by the smallest relevant object; conservative domain-valid augmentation; and a linear-head baseline. Compare crops or tiling against resizing, calibrate and stratify by source, inspect errors, then selectively unfreeze. Use cross-validation or repeated splits for uncertainty and prioritize labeling ambiguous failure modes over increasing architecture size.
    priority: common
    difficulty: advanced
    roles: [general-mle, applied-scientist, dl-specialist]
    kind: system-design
    round: system-design
    stability: evergreen
    tags: [small-data, transfer-learning, system-design]
    aliases: [limited labels vision, high resolution images]
  - id: q-vision-debugging-pipeline
    question: 'A vision model does not overfit one tiny batch. What do you inspect first?'
    conciseAnswer: >-
      Freeze stochastic augmentation, inspect image ranges and channels, visualize labels after every transform, verify class indices and loss-logit contracts, and confirm gradients and parameter updates are finite and nonzero. Put normalization and dropout in the intended mode, lower regularization, test a simple head, and compare one manually computed sample. Failure on a tiny clean batch usually indicates data, shape, loss, mode, or optimization wiring—not insufficient generalization.
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, dl-specialist]
    kind: debugging
    round: coding
    stability: evergreen
    tags: [debugging, overfit-batch, preprocessing]
    aliases: [CNN will not train, vision sanity check]
  - id: q-vision-imbalance-shift
    question: 'How do class imbalance and image-source shift change a vision evaluation plan?'
    conciseAnswer: >-
      Preserve realistic prevalence in the final test set, stratify metrics by class and acquisition source, and use precision-recall or cost-weighted operating points rather than accuracy alone. Reweighting or resampling changes the training objective and may alter calibration; source-specific artifacts can inflate random-split results, so group splits and an external or later-time test are often more informative than another model variant.
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, dl-specialist]
    kind: trade-off
    round: experimentation
    stability: evergreen
    tags: [class-imbalance, domain-shift, evaluation]
    aliases: [vision dataset shift, imbalanced image classification]
  - id: q-vision-explanations
    question: 'What can saliency maps tell you about a vision model, and what can they not establish?'
    conciseAnswer: >-
      A saliency method probes sensitivity or attributes a prediction under a chosen baseline and algorithm; it can reveal obvious background shortcuts and motivate targeted tests. It is not a causal proof, can be unstable or visually persuasive without model specificity, and different methods answer different questions. Validate explanations with controlled perturbations, counterfactual data, subgroup errors, and human review rather than accepting one heat map.
    priority: specialist
    difficulty: advanced
    roles: [applied-scientist, research-scientist, dl-specialist]
    kind: trade-off
    round: project-defense
    stability: evergreen
    tags: [interpretability, saliency, shortcuts]
    aliases: [Grad CAM limitations, vision explanations]
