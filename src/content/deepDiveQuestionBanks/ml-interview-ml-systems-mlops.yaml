    aliases: [safe-rollout, model-deployment-strategies]
  - id: q-mlops-monitoring-stack
    question: 'What should an ML system monitor when labels arrive late?'
    conciseAnswer: 'Monitor service health, schema and feature integrity, missingness/range, prediction and confidence distributions, slice and business guardrails, feedback/label coverage and delay, and eventually outcome metrics. Drift alerts are diagnostic leads; pair them with ownership, thresholds based on historical variability, and a runbook.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, ml-platform]
    kind: system-design
    round: system-design
    stability: evergreen
    tags: [monitoring, delayed-labels, data-quality]
    aliases: [ml-observability, production-metrics]
  - id: q-mlops-drift-performance
    question: 'Why does distribution drift neither imply nor exclude model-performance degradation?'
    conciseAnswer: 'A large shift can occur in irrelevant features with no metric change, while concept drift can damage predictions without a large marginal feature shift. Compare drift to stable references by slice, prioritize features tied to decisions, and confirm impact with delayed outcomes, shadow labels, or controlled review.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, ml-platform]
    kind: concept
    round: knowledge
    stability: evergreen
    tags: [drift, performance, observability]
    aliases: [data-drift-vs-concept-drift, drift-alert]
  - id: q-mlops-retraining-policy
    question: 'How do you choose between scheduled, threshold-triggered, and continuous retraining?'
    conciseAnswer: 'Schedule when change is predictable and labels are slow; trigger when validated quality/data conditions cross sustained thresholds; retrain continuously only when labels, safeguards, and rollback are mature. Every policy needs freshness objectives, minimum evidence, evaluation gates, budget limits, and protection against feedback-driven self-corruption.'
    priority: common
    difficulty: advanced
    roles: [applied-scientist, ml-platform, leadership]
    kind: trade-off
    round: system-design
    stability: evergreen
    tags: [retraining, automation, feedback-loops]
    aliases: [model-refresh, continuous-training]
  - id: q-mlops-rollback
    question: 'What makes an ML rollback safe and actually usable during an incident?'
    conciseAnswer: 'Keep the prior model, feature schema, preprocessing, dependencies, and policy mutually compatible; separate deploy from traffic shift; define automatic and human rollback triggers; preserve audit logs; and regularly exercise the path. Stateful features and irreversible user actions require forward mitigation, not only binary rollback.'
    priority: must-know
    difficulty: advanced
    roles: [ml-platform, leadership]
    kind: debugging
    round: system-design
    stability: evergreen
    tags: [rollback, incident-response, compatibility]
    aliases: [model-recovery, safe-revert]
  - id: q-mlops-parallelism
    question: 'Compare data, tensor/model, and pipeline parallelism for distributed training.'
    conciseAnswer: 'Data parallelism replicates the model and synchronizes gradients; tensor/model parallelism shards operations or parameters when one model does not fit; pipeline parallelism partitions layers and overlaps microbatches but creates bubbles and scheduling complexity. Real large-model training composes them around memory and interconnect topology.'
    priority: must-know
    difficulty: advanced
    roles: [research-scientist, dl-specialist, ml-platform]
    kind: trade-off
