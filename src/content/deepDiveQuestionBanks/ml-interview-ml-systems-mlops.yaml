    aliases: [parallel-training, model-sharding]
  - id: q-mlops-sync-async
    question: 'What are the tradeoffs between synchronous and asynchronous distributed optimization?'
    conciseAnswer: 'Synchronous workers compute a consistent step but wait for stragglers; asynchronous workers improve utilization but apply stale gradients, changing optimization and reproducibility. Bounded staleness, elastic batches, gradient accumulation, and straggler mitigation occupy the middle; compare statistical efficiency per wall-clock and failure behavior.'
    priority: common
    difficulty: advanced
    roles: [research-scientist, dl-specialist, ml-platform]
    kind: mathematics
    round: knowledge
    stability: evergreen
    tags: [distributed-optimization, staleness, stragglers]
    aliases: [sync-vs-async, parameter-server]
  - id: q-mlops-idempotence-faults
    question: 'Why do idempotence and checkpoint semantics matter in ML pipelines?'
    conciseAnswer: 'Retries are inevitable; a task must produce the same committed logical result or detect prior completion rather than duplicate examples, labels, or registry entries. Use immutable inputs, deterministic keys, atomic publication, lineage, and checkpoints that jointly capture model, optimizer, scheduler, RNG, and data position.'
    priority: common
    difficulty: advanced
    roles: [ml-platform, applied-scientist]
    kind: implementation
    round: system-design
    stability: evergreen
    tags: [idempotence, checkpoints, fault-tolerance]
    aliases: [exactly-once, resumable-training]
  - id: q-mlops-global-design
    question: 'How would you design a multi-region ML service with freshness, availability, and cost constraints?'
    conciseAnswer: 'Quantify regional demand, latency/freshness SLOs, residency, failure tolerance, and budget; separate globally versioned artifacts from regional features and serving; choose consistency per state; route with health-aware failover; degrade to cached/baseline decisions; and monitor regional skew plus deployment convergence.'
    priority: common
    difficulty: advanced
    roles: [ml-platform, leadership]
    kind: system-design
    round: system-design
    stability: evergreen
    tags: [multi-region, availability, consistency, disaster-recovery]
    aliases: [global-ml-platform, regional-serving]
