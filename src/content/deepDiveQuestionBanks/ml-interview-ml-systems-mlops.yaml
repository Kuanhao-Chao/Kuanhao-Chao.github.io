    aliases: [serving-optimization, latency-quality-tradeoff]
  - id: q-mlops-registry-lineage
    question: 'What should a model registry record beyond a model file?'
    conciseAnswer: 'Record immutable artifact digest, training code/config/environment, data and feature lineage, evaluation by slices, approvals, intended use, dependencies, schema/signature, owner, deployment history, and compatibility constraints. A registry is a control plane for promotion and rollback, not a folder with numbered binaries.'
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, ml-platform]
    kind: implementation
    round: system-design
    stability: evergreen
    tags: [model-registry, lineage, governance]
    aliases: [artifact-metadata, model-versioning]
  - id: q-mlops-shadow-canary-rollout
    question: 'Compare shadow, canary, A/B, and blue-green model rollouts.'
    conciseAnswer: 'Shadowing copies traffic without affecting decisions, validating compatibility and latency; canaries expose a small cohort for safety; A/B tests estimate causal product impact with randomized assignment; blue-green keeps two complete environments for rapid switching. They answer different questions and may be composed in that order.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, ml-platform, leadership]
    kind: trade-off
    round: system-design
    stability: evergreen
