lesson: ml-interview-ml-systems-mlops
questions:
  - id: q-mlops-reproducible-pipeline
    question: 'What must be versioned to reproduce an ML training run?'
    conciseAnswer: 'Version immutable data snapshots or queries plus event time, feature and label code, split manifests, environment/container, dependencies, source commit, configuration, seeds, hardware-sensitive settings, and produced artifacts. Reproduction means rebuilding the decision-relevant result within declared tolerance, not merely storing weights.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, ml-platform]
    kind: system-design
    round: system-design
    stability: evergreen
    tags: [reproducibility, lineage, training-pipeline]
    aliases: [reproduce-training, experiment-lineage]
  - id: q-mlops-train-serve-skew
    question: 'What causes training-serving skew, and how do you prevent it?'
    conciseAnswer: 'Skew arises when feature definitions, event-time joins, missing/default behavior, transforms, or library semantics differ between offline training and online serving. Share or compile one transformation contract, replay production requests, log served features, validate point-in-time joins, and compare shadow predictions before rollout.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, ml-platform]
    kind: debugging
    round: system-design
    stability: evergreen
    tags: [feature-store, skew, point-in-time-correctness]
    aliases: [training-serving-skew, feature-parity]
  - id: q-mlops-batch-stream-online
    question: 'When should inference be batch, streaming, or synchronous online?'
    conciseAnswer: 'Choose from freshness and response-time requirements: batch precomputes high-throughput results cheaply, streaming incrementally refreshes state after events, and online inference serves request-time context at higher reliability and latency cost. Hybrid systems commonly batch expensive embeddings and score a small candidate set online.'
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, ml-platform]
    kind: trade-off
    round: system-design
    stability: evergreen
    tags: [batch, streaming, online-serving]
    aliases: [inference-mode, batch-vs-online]
  - id: q-mlops-capacity-estimation
    question: 'How do you estimate inference capacity, latency, and cost before choosing an architecture?'
    conciseAnswer: 'Convert peak requests per second, payload and model size, service-time distribution, utilization target, replication, and availability margin into compute/memory/network budgets. Report p50/p95/p99—not averages—then benchmark the complete path under realistic batching and concurrency because queueing dominates near saturation.'
    priority: must-know
    difficulty: advanced
    roles: [ml-platform, genai, leadership]
    kind: mathematics
    round: system-design
    stability: evergreen
    tags: [capacity, latency, queueing, cost]
    aliases: [back-of-envelope, inference-sizing]
  - id: q-mlops-serving-architecture
    question: 'Design a reliable online model-serving path.'
    conciseAnswer: 'Use authenticated ingress, request validation, point-in-time feature retrieval, a versioned model server, bounded-time downstream calls, policy/postprocessing, response logging, and observable fallbacks. Replicate across failure domains, cap concurrency, make retries safe, and keep the previous compatible model/config ready for rollback.'
    priority: must-know
    difficulty: advanced
    roles: [general-mle, ml-platform, leadership]
    kind: system-design
    round: system-design
    stability: evergreen
    tags: [serving, reliability, fallback, rollback]
    aliases: [online-inference-design, model-server]
  - id: q-mlops-caching-batching-approximation
    question: 'How do caching, dynamic batching, quantization, and approximate retrieval trade quality for efficiency?'
    conciseAnswer: 'Caching avoids repeated work but creates staleness and invalidation risk; batching improves accelerator utilization but adds queue delay; quantization reduces memory/compute with distribution-dependent error; approximate retrieval buys latency at recall cost. Expose each as a versioned knob and measure end-to-end utility under the latency budget.'
    priority: common
    difficulty: advanced
    roles: [dl-specialist, genai, ml-platform]
    kind: trade-off
    round: system-design
    stability: fast-moving
    verified: 2026-08-22
