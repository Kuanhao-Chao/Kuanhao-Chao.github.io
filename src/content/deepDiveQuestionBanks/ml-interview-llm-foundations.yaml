    aliases: [neural-scaling, power-laws]
  - id: q-llm-compute-optimal
    question: 'What does compute-optimal training mean for model size and token count?'
    conciseAnswer: 'For a fixed training-compute budget, compute-optimality chooses model parameters and training tokens jointly to minimize validation loss rather than maximizing parameter count. The optimum depends on the fitted scaling regime, data mixture, reuse, architecture, and deployment objective, so it is a planning estimate rather than a timeless ratio.'
    priority: common
    difficulty: advanced
    roles: [research-scientist, dl-specialist, leadership]
    kind: trade-off
    round: system-design
    stability: evergreen
