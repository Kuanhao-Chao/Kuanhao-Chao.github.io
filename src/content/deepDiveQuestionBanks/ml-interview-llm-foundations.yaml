  - id: q-llm-decoding
    question: 'Compare greedy decoding, beam search, and stochastic sampling.'
    conciseAnswer: 'Greedy decoding takes the highest-probability token locally; beam search retains several high-scoring prefixes and is useful when sequence likelihood aligns with the task; sampling preserves distributional diversity. The right method follows the product objective, and none repairs an incorrect model distribution.'
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, dl-specialist, genai]
    kind: trade-off
    round: knowledge
    stability: evergreen
    tags: [decoding, beam-search, sampling]
    aliases: [generation-strategies, greedy-vs-beam]
  - id: q-llm-temperature-top-p
    question: 'How do temperature, top-k, and nucleus sampling alter token generation?'
    conciseAnswer: 'Temperature rescales all logits before softmax; values below one sharpen and above one flatten. Top-k restricts support to k tokens, while top-p keeps the smallest set whose cumulative probability reaches p. Their interaction changes diversity and tail risk and must be evaluated on the application, not treated as creativity knobs.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, dl-specialist, genai]
    kind: mathematics
    round: knowledge
    stability: evergreen
    tags: [temperature, top-k, nucleus-sampling]
    aliases: [top-p, sampling-parameters]
  - id: q-llm-repetition-stopping
    question: 'How would you debug repetition, truncation, and failure to stop during generation?'
    conciseAnswer: 'First inspect the token stream, stop-token configuration, chat template, maximum-token limit, and sampling policy. Then distinguish a serving bug from model probability: repetition penalties and stop strings can mask symptoms, but malformed prompts, distribution shift, or weak training may require data or model changes.'
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, genai, ml-platform]
    kind: debugging
