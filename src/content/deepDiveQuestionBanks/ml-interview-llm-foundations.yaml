    aliases: [context-window, lost-in-the-middle]
  - id: q-llm-scaling-laws
    question: 'What can and cannot be concluded from empirical neural scaling laws?'
    conciseAnswer: 'Within measured regimes, held-out loss often follows smooth power-law trends with model size, data, and compute. These are empirical fits useful for allocation and forecasting, not universal laws: data quality, architecture, optimizer, downstream thresholds, and extrapolation can change the curve.'
    priority: must-know
    difficulty: advanced
    roles: [applied-scientist, research-scientist, dl-specialist, leadership]
    kind: concept
    round: project-defense
    stability: evergreen
