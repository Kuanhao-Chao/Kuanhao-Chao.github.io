lesson: ml-interview-llm-foundations
questions:
  - id: q-llm-tokenization
    question: 'Why do language models use subword tokenization, and what can go wrong at token boundaries?'
    conciseAnswer: 'Subword vocabularies trade sequence length against vocabulary size while retaining a path to represent rare strings. Token boundaries are learned compression artifacts, not linguistic truth: spelling, numbers, whitespace, morphology, and different languages can receive unequal token budgets, which changes cost and model difficulty.'
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, dl-specialist, genai]
    kind: concept
    round: knowledge
    stability: evergreen
    tags: [tokenization, bpe, vocabulary]
    aliases: [subword-tokenization, byte-pair-encoding]
  - id: q-llm-causal-objective
    question: 'Derive the causal language-model objective and explain teacher forcing.'
    conciseAnswer: 'The chain rule factors a sequence probability as a product of next-token conditionals. Training minimizes the summed negative log probability of each observed next token while supplying the true prefix; this parallel teacher-forced computation differs from autoregressive inference, where generated tokens become future inputs.'
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist, genai]
    kind: mathematics
    round: knowledge
    stability: evergreen
    tags: [pretraining, autoregressive, teacher-forcing]
    aliases: [next-token-prediction, causal-lm-loss]
  - id: q-llm-masked-vs-causal
    question: 'Compare masked-language modeling with causal-language modeling.'
    conciseAnswer: 'Masked modeling predicts selected hidden tokens using both left and right context, which is natural for representation learning. Causal modeling predicts each token only from its prefix, matching left-to-right generation. Neither objective alone guarantees instruction following, factuality, or calibrated uncertainty.'
    priority: common
    difficulty: foundational
    roles: [general-mle, applied-scientist, dl-specialist, genai]
    kind: trade-off
    round: knowledge
    stability: evergreen
    tags: [masked-lm, causal-lm, pretraining]
    aliases: [bert-vs-gpt-objective, denoising-vs-autoregressive]
  - id: q-llm-cross-entropy-perplexity
    question: 'What does perplexity measure, and when is comparing perplexity invalid?'
    conciseAnswer: 'Token-level perplexity is the exponential of average negative log-likelihood, so lower means more probability assigned to the observed tokens. Values are comparable only under the same evaluation text, tokenization, normalization, and likelihood accounting; a different tokenizer changes the prediction units and denominator.'
    priority: must-know
    difficulty: intermediate
    roles: [applied-scientist, research-scientist, dl-specialist, genai]
    kind: mathematics
    round: experimentation
    stability: evergreen
    tags: [perplexity, cross-entropy, evaluation]
    aliases: [language-model-perplexity, bits-per-token]
  - id: q-llm-transformer-path
    question: 'Trace one token through a decoder-only Transformer block.'
    conciseAnswer: 'A token and position representation enter a residual stream; normalized states produce causal self-attention queries, keys, and values, the attention update returns through a residual connection, and a position-wise MLP adds another update. A final projection maps the resulting state to vocabulary logits.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, dl-specialist, genai]
    kind: concept
    round: knowledge
    stability: evergreen
    tags: [transformer, residual-stream, attention]
    aliases: [decoder-block, transformer-forward-pass]
  - id: q-llm-context-position
    question: 'Why does a long advertised context window not guarantee effective long-context reasoning?'
    conciseAnswer: 'A positional scheme makes order representable, but effective use also depends on training-length coverage, attention allocation, distractors, retrieval position, optimization, and evaluation. Context capacity is an interface limit; accuracy must be measured across relevant lengths and information positions.'
    priority: common
    difficulty: intermediate
    roles: [applied-scientist, research-scientist, dl-specialist, genai]
    kind: trade-off
    round: experimentation
    stability: fast-moving
    verified: 2026-08-22
