  - id: q-llm-moe
    question: 'How does a sparse mixture-of-experts language model trade capacity against compute?'
    conciseAnswer: 'A router sends each token to a small subset of expert feed-forward networks, so total parameter capacity can grow without activating every parameter for every token. Routing balance, communication, expert capacity, dropped tokens, memory, and serving complexity become first-class failure modes.'
    priority: common
    difficulty: advanced
    roles: [research-scientist, dl-specialist, ml-platform]
    kind: trade-off
    round: system-design
    stability: evergreen
