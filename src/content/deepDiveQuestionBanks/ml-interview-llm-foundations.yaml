  - id: q-llm-kv-cache
    question: 'What is the key-value cache, and how do you estimate its memory cost?'
    conciseAnswer: 'Autoregressive decoding stores prior attention keys and values so each new token need not recompute them. Memory scales with batch size, cached sequence length, layer count, key-value head count, head dimension, two tensors, and bytes per element; grouped-query attention reduces the head factor.'
    priority: must-know
    difficulty: advanced
    roles: [dl-specialist, genai, ml-platform]
    kind: mathematics
    round: system-design
    stability: evergreen
    tags: [kv-cache, inference-memory, attention]
    aliases: [attention-cache, decoder-cache]
  - id: q-llm-prefill-decode
    question: 'Why should LLM serving distinguish prefill latency from decode latency?'
    conciseAnswer: 'Prefill processes prompt tokens in parallel and is usually compute intensive; decoding generates one token per sequence step while repeatedly reading weights and cache, often making it memory-bandwidth and scheduling sensitive. Time-to-first-token, inter-token latency, and total throughput expose different bottlenecks.'
    priority: must-know
    difficulty: intermediate
    roles: [genai, ml-platform, leadership]
    kind: system-design
    round: system-design
    stability: fast-moving
    verified: 2026-08-22
    tags: [prefill, decode, serving, latency]
    aliases: [ttft, time-per-output-token]
  - id: q-llm-attention-complexity
    question: 'What are the time and memory complexities of dense self-attention?'
    conciseAnswer: 'Forming all query-key scores for sequence length n and head width d costs O(n squared d) arithmetic and materializing the score matrix costs O(n squared) memory per head, while projections add O(n d_model squared). During cached single-token decoding, attention over the existing context is linear in cached length per step.'
    priority: must-know
    difficulty: intermediate
    roles: [applied-scientist, research-scientist, dl-specialist, ml-platform]
    kind: mathematics
    round: knowledge
    stability: evergreen
    tags: [attention, complexity, long-context]
    aliases: [quadratic-attention, transformer-complexity]
  - id: q-llm-flash-attention
    question: 'Does FlashAttention make exact attention subquadratic? Explain the actual optimization.'
    conciseAnswer: 'FlashAttention remains an exact dense-attention algorithm with quadratic arithmetic in sequence length. It tiles the computation and avoids materializing the full score matrix in high-bandwidth memory, reducing memory traffic and auxiliary storage; the speedup depends on hardware, shapes, kernel support, and surrounding operations.'
    priority: common
    difficulty: advanced
    roles: [research-scientist, dl-specialist, ml-platform]
    kind: implementation
    round: knowledge
    stability: fast-moving
    verified: 2026-08-22
    tags: [flash-attention, io-awareness, gpu]
    aliases: [memory-efficient-attention, attention-kernel]
  - id: q-llm-quantization
    question: 'What is lost when language-model weights or activations are quantized?'
    conciseAnswer: 'Quantization represents values with fewer bits, reducing storage and memory bandwidth and sometimes increasing hardware throughput. Rounding, clipping, outliers, calibration data, accumulator precision, and unsupported kernels can degrade accuracy or erase speed gains; weight-only and weight-plus-activation schemes have different risks.'
    priority: common
    difficulty: advanced
    roles: [applied-scientist, dl-specialist, genai, ml-platform]
    kind: trade-off
    round: system-design
    stability: fast-moving
    verified: 2026-08-22
    tags: [quantization, inference, precision]
    aliases: [int8, low-bit-inference]
  - id: q-llm-inference-capacity
    question: 'Design a capacity plan for an LLM endpoint with latency and cost constraints.'
    conciseAnswer: 'Measure the prompt and output-length distributions, separate prefill and decode service times, choose an SLO percentile, estimate weight and cache memory, and load-test realistic concurrency. Dynamic batching raises throughput but can hurt tail latency; admission control, token budgets, prefix caching, routing, and fallback policies must be modeled together.'
    priority: common
    difficulty: advanced
    roles: [genai, ml-platform, leadership]
    kind: system-design
    round: system-design
    stability: fast-moving
    verified: 2026-08-22
