    stability: evergreen
    tags: [project-defense, ownership, evidence]
    aliases: [deep-dive-project, explain-your-project]
  - id: q-code-failed-experiment
    question: 'How do you present a failed experiment or negative research result as strong evidence?'
    conciseAnswer: 'State the prior hypothesis and success criterion, show the controlled comparison and uncertainty, diagnose what the result falsified, describe the decision it changed, and identify the cheapest next test. Do not relabel failure as success; demonstrate that the evidence reduced uncertainty or prevented a worse investment.'
    priority: common
