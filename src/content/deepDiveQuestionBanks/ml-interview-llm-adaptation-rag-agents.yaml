  - id: q-agent-prompt-injection
    question: 'How does indirect prompt injection threaten a tool-using RAG system?'
    conciseAnswer: 'Untrusted retrieved text can contain instructions that compete with the application policy and induce disclosure or tool misuse. Prompt hierarchy alone is not a security boundary: isolate content from control, enforce least privilege and destination policy in code, sanitize rendering, require confirmation for consequential actions, and test adversarial documents.'
    priority: must-know
    difficulty: advanced
    roles: [genai, ml-platform, leadership]
    kind: system-design
    round: system-design
    stability: fast-moving
    verified: 2026-08-22
