    aliases: [faithfulness, citation-verification]
  - id: q-rag-evaluation
    question: 'Design an evaluation stack for a RAG application before launch.'
    conciseAnswer: 'Create versioned, deduplicated examples with answerable and unanswerable cases; score retrieval recall and rank, answer correctness, claim support, citation validity, refusal, safety, latency, and cost. Use human review to calibrate automated judges, slice by query and corpus conditions, then validate business outcomes online.'
    priority: must-know
    difficulty: advanced
    roles: [applied-scientist, research-scientist, genai, leadership]
    kind: system-design
    round: system-design
    stability: fast-moving
