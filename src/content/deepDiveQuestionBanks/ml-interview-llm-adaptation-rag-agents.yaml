lesson: ml-interview-llm-adaptation-rag-agents
questions:
  - id: q-rag-prompt-vs-rag-vs-finetune
    question: 'How do you choose among prompting, retrieval, and fine-tuning for an LLM application?'
    conciseAnswer: 'Prompting changes instructions and context, retrieval supplies mutable external evidence, and fine-tuning changes model behavior or task priors. Choose from the diagnosed error: missing current facts favors retrieval; inconsistent format or behavior may favor examples or fine-tuning; no technique guarantees factuality, so keep an evaluated baseline and escalation path.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, genai, leadership]
    kind: system-design
    round: system-design
    stability: fast-moving
    verified: 2026-08-22
    tags: [prompting, rag, fine-tuning]
    aliases: [adaptation-choice, rag-vs-finetuning]
  - id: q-rag-sft
    question: 'What does supervised fine-tuning optimize, and why can a small dataset cause regressions?'
    conciseAnswer: 'SFT applies token-level likelihood training to curated input-output demonstrations, teaching response style and conditional behavior. A narrow, duplicated, contaminated, or low-quality set can overfit, forget useful behavior, distort calibration, or teach shortcuts; mix design, held-out slices, and regression evaluations matter as much as optimizer settings.'
    priority: must-know
    difficulty: foundational
    roles: [applied-scientist, research-scientist, dl-specialist, genai]
    kind: concept
    round: project-defense
    stability: evergreen
    tags: [sft, fine-tuning, data-quality]
    aliases: [instruction-tuning, supervised-adaptation]
  - id: q-rag-lora
    question: 'How does LoRA reduce trainable parameters, and what does it not reduce automatically?'
    conciseAnswer: 'LoRA freezes a weight matrix and learns a low-rank update B times A, reducing trainable parameters and optimizer state. It does not automatically reduce base-weight memory, activation memory, sequence-length cost, data requirements, or inference latency unless adapters are merged or served with an efficient adapter-aware runtime.'
    priority: must-know
    difficulty: intermediate
    roles: [applied-scientist, research-scientist, dl-specialist, genai, ml-platform]
    kind: mathematics
    round: knowledge
    stability: evergreen
    tags: [lora, peft, low-rank]
    aliases: [parameter-efficient-finetuning, adapters]
  - id: q-rag-rlhf
    question: 'Describe the RLHF pipeline and its main statistical failure modes.'
    conciseAnswer: 'A typical pipeline obtains preference comparisons, fits a reward model, and optimizes a policy against that proxy while constraining drift from a reference policy. Annotator disagreement, selection bias, reward-model extrapolation, reward hacking, mode collapse, and evaluation dependence mean the resulting model optimizes measured preference—not universal human values.'
    priority: must-know
    difficulty: advanced
    roles: [research-scientist, dl-specialist, genai]
    kind: concept
    round: knowledge
    stability: evergreen
    tags: [rlhf, preference-learning, reward-model]
    aliases: [human-feedback, reward-modeling]
  - id: q-rag-dpo
    question: 'What objective does Direct Preference Optimization use, and how does it relate to RLHF?'
    conciseAnswer: 'DPO turns preferred-versus-rejected response pairs into a logistic objective over the policy log-ratio relative to a reference model. It avoids fitting an explicit reward model and running an online RL optimizer, but still inherits preference-data bias, reference-policy dependence, coverage limits, and sensitivity to its regularization scale.'
    priority: common
    difficulty: advanced
    roles: [research-scientist, dl-specialist, genai]
    kind: mathematics
    round: knowledge
