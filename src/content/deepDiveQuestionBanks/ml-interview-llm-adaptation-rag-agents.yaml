  - id: q-rag-retrieval
    question: 'What should be measured separately in a RAG retrieval stage?'
    conciseAnswer: 'Measure whether answer-bearing evidence is indexed, retrieved in top-k, and ranked early, using judged relevance and query slices. Separate corpus coverage, parser quality, embedding recall, filter failures, freshness, and latency; end-answer accuracy alone cannot localize which retrieval component failed.'
    priority: must-know
