  - id: q-rag-hybrid-reranking
    question: 'Why combine lexical retrieval, dense retrieval, and reranking?'
    conciseAnswer: 'Lexical systems preserve exact rare terms, dense retrievers capture learned semantic similarity, and a cross-encoder reranker can model query-document interactions more precisely on a small candidate set. Fusion improves coverage but adds tuning, latency, and failure dependencies; evaluate components and fused rankings by slice.'
    priority: common
    difficulty: intermediate
    roles: [applied-scientist, genai, ml-platform]
    kind: system-design
    round: system-design
    stability: evergreen
