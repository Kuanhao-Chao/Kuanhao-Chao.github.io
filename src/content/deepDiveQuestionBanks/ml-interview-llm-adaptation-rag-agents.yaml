    aliases: [direct-preference-optimization, dpo-vs-rlhf]
  - id: q-rag-chunking
    question: 'How would you choose chunk boundaries and overlap for retrieval-augmented generation?'
    conciseAnswer: 'Start from semantic units and the evidence span needed to answer, then tune size and overlap on retrieval recall, attribution, latency, and redundancy. Tiny chunks lose context; large chunks dilute embeddings and consume generation context; overlap can recover boundary evidence but creates duplicates and biased rankings.'
    priority: must-know
