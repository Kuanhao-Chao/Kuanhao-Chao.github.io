  - id: q-agent-loop
    question: 'What are the essential states in an agent control loop?'
    conciseAnswer: 'A robust loop separates observation, plan or policy choice, validated action proposal, authorization, execution, result recording, termination, and recovery. Explicit budgets and terminal states prevent unbounded loops; checkpoints and idempotent actions support retries without repeating irreversible side effects.'
    priority: common
