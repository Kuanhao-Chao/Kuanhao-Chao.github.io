  - id: q-rag-grounded-generation
    question: 'How do you make a generated answer grounded in retrieved evidence?'
    conciseAnswer: 'Require claim-level support, pass provenance with evidence, instruct the model to abstain when evidence is insufficient, and verify citations against the exact source spans. Groundedness is an evaluated relationship between answer and evidence, not a property conferred by adding documents to a prompt.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, genai]
    kind: implementation
    round: system-design
