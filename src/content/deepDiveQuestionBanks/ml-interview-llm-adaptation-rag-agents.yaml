    aliases: [rag-eval, evaluation-pyramid]
  - id: q-rag-contamination
    question: 'How can evaluation contamination make an LLM or RAG system look better than it is?'
    conciseAnswer: 'Benchmarks, answers, near-duplicates, or future documents can leak into pretraining, tuning, prompts, retrieval indexes, or judge context. Use provenance and time-based splits, deduplication, canary items, held-out private sets, and exposure audits; a familiar benchmark score alone is weak evidence of generalization.'
    priority: must-know
    difficulty: advanced
    roles: [applied-scientist, research-scientist, genai]
    kind: debugging
    round: experimentation
    stability: fast-moving
