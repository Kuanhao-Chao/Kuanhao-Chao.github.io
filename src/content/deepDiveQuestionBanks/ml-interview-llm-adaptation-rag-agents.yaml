  - id: q-agent-reliability
    question: 'Why are agent demonstrations not evidence of production reliability?'
    conciseAnswer: 'A successful trace samples one task, environment, tool state, and stochastic path. Reliability requires task-distribution success rates, repeated trials, side-effect severity, calibrated uncertainty, recovery behavior, and adversarial tests; longer autonomous horizons compound per-step failures and environmental drift.'
    priority: must-know
