    aliases: [indirect-prompt-injection, tool-security]
  - id: q-agent-permissions
    question: 'Design a least-privilege execution boundary for an LLM agent.'
    conciseAnswer: 'Issue short-lived task-scoped credentials, allowlist tools and resource targets, separate read from write, cap money and compute, validate arguments server-side, sandbox untrusted code, and require human approval for high-impact actions. Record immutable traces while minimizing secrets and personal data.'
    priority: common
    difficulty: advanced
    roles: [genai, ml-platform, leadership]
    kind: system-design
    round: system-design
    stability: fast-moving
    verified: 2026-08-22
    tags: [least-privilege, sandboxing, authorization]
    aliases: [agent-permissions, execution-safety]
  - id: q-agent-latency-cost
    question: 'How do you reduce latency and cost without silently degrading an LLM workflow?'
    conciseAnswer: 'Decompose cost and latency by retrieval, reranking, prompt tokens, model calls, output tokens, tools, and retries. Then test caching, smaller routing models, bounded context, parallel independent calls, early exits, and response limits against quality and safety gates; averages alone hide expensive tails and retry storms.'
    priority: common
    difficulty: advanced
    roles: [genai, ml-platform, leadership]
    kind: trade-off
    round: system-design
    stability: fast-moving
    verified: 2026-08-22
    tags: [latency, cost, routing]
    aliases: [llm-cost-optimization, token-budget]
  - id: q-agent-production-monitoring
    question: 'What should a production RAG or agent system monitor after launch?'
    conciseAnswer: 'Monitor input and corpus drift, retrieval coverage, answer support, abstention, tool errors, policy violations, user corrections, latency, token and external-tool cost, and business outcomes. Preserve versioned prompts, models, indexes, policies, and traces so regressions are reproducible, with privacy-aware sampling and rollback.'
    priority: common
