  - id: q-agent-tool-use
    question: 'What contract should an LLM tool call satisfy?'
    conciseAnswer: 'A tool contract needs a narrow typed schema, semantic field descriptions, validation, authentication context, timeouts, idempotency rules, structured errors, and auditable results. Treat generated arguments as untrusted input; deterministic application code—not prose—must enforce permissions and invariants.'
    priority: must-know
