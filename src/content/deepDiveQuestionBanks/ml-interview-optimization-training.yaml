    aliases: [gradient flow, unstable gradients]
  - id: q-opt-gradient-clipping
    question: 'What does gradient clipping do, and what does it not fix?'
    conciseAnswer: >-
      Global-norm clipping rescales the complete gradient vector when its norm exceeds a threshold, preserving direction while limiting one update; value clipping changes direction by clipping coordinates. It contains rare explosions but does not repair a bad loss, persistent numerical overflow, too-high learning rate, or chronically unstable architecture.
    priority: common
    difficulty: intermediate
