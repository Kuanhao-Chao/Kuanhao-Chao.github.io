    aliases: [large batch training, minibatch size]
  - id: q-opt-schedules
    question: 'Why use learning-rate warmup and decay schedules?'
    conciseAnswer: >-
      Warmup prevents large early parameter moves while moments, normalization statistics, and representations are uninformative; decay converts later updates into fine adjustments. Step, cosine and plateau schedules encode different assumptions, and schedule progress should usually follow optimizer steps or tokens rather than wall time.
