  - id: q-opt-mixed-precision
    question: 'How does mixed-precision training speed up models without corrupting optimization?'
    conciseAnswer: >-
      Mixed precision runs eligible operations in a low-precision dtype for faster tensor cores and lower memory while retaining sensitive reductions and optimizer state at higher precision. Loss scaling protects small FP16 gradients from underflow, but BF16 usually needs no scaling because it retains FP32's exponent range; always unscale before clipping and check for nonfinite gradients.
    priority: common
    difficulty: intermediate
