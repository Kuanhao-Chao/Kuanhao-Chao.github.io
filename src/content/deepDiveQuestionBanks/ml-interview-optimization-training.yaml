    aliases: [patience, best checkpoint]
  - id: q-opt-accumulation-distributed
    question: 'Are gradient accumulation and distributed data parallelism equivalent to one large batch?'
    conciseAnswer: >-
      They can produce the same averaged gradient only when they cover the same examples with the same parameters and stochastic behavior, the loss is scaled correctly, and no update occurs between microbatches. Batch-normalization statistics, dropout masks, gradient clipping, optimizer-step schedules, communication precision and variable-length token counts create practical differences.
    priority: common
    difficulty: advanced
    roles: [general-mle, dl-specialist, ml-platform]
    kind: implementation
    round: system-design
    stability: evergreen
    tags: [gradient-accumulation, distributed-training, effective-batch]
    aliases: [DDP batch equivalence, microbatching]
