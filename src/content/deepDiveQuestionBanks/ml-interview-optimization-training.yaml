  - id: q-opt-adam
    question: 'How does Adam work, and when might SGD still be preferable?'
    conciseAnswer: >-
      Adam keeps bias-corrected exponential averages of the gradient and squared gradient, producing coordinate-wise adaptive steps. It often trains quickly and tolerates sparse or uneven gradients, while tuned momentum SGD can generalize better on some vision tasks and uses less optimizer state; Adam is not automatically a substitute for learning-rate schedules or validation.
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
