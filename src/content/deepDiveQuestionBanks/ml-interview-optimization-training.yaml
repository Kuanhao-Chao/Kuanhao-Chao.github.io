  - id: q-opt-initialization
    question: 'How do Xavier and He initialization preserve signal through a network?'
    conciseAnswer: >-
      They choose weight variance so activations and gradients neither grow nor vanish layer by layer under simplifying independence assumptions. Xavier uses roughly 2/(fan-in+fan-out) for symmetric activations, while He uses 2/fan-in for ReLU because about half the preactivations are removed; residuals, attention and normalization can require architecture-specific scaling.
    priority: common
    difficulty: intermediate
