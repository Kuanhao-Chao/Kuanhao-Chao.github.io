  - id: q-opt-vanishing-exploding
    question: 'What causes vanishing and exploding gradients, and how do you diagnose them?'
    conciseAnswer: >-
      Backpropagation multiplies Jacobians, so singular values repeatedly below or above one shrink or amplify gradients exponentially with depth or sequence length. Log per-layer gradient and activation norms, check finite values and saturation, then address the mechanism with suitable initialization, residual paths, normalization, gated recurrence, shorter paths, or clipping for explosions.
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: debugging
    round: knowledge
    stability: evergreen
