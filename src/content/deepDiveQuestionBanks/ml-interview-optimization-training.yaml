    aliases: [Adam optimizer, Adam versus SGD]
  - id: q-opt-adamw
    question: 'Why is AdamW different from adding an L2 penalty when using Adam?'
    conciseAnswer: >-
      With plain SGD, an L2 gradient and multiplicative weight decay are equivalent after rescaling, but Adam preconditions the L2 gradient coordinate by coordinate. AdamW decouples shrinkage from that preconditioner, applying a direct parameter contraction, which makes the regularization strength easier to interpret and tune independently of adaptive moments.
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
