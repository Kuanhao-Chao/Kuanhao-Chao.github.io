  - id: q-opt-landscape
    question: 'Are local minima the main optimization problem in deep neural networks?'
    conciseAnswer: >-
      Usually not in the simple low-dimensional sense: overparameterized networks contain many equivalent solutions and broad connected low-loss regions, while saddles, plateaus, ill conditioning, noisy gradients and scale symmetries often dominate training behavior. Loss value alone also does not determine generalization, so sharpness claims must account for parameterization.
    priority: specialist
