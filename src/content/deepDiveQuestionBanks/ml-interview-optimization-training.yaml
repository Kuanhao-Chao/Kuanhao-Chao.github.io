  - id: q-opt-batch-size
    question: 'How does batch size affect throughput, optimization, and generalization?'
    conciseAnswer: >-
      Larger batches reduce gradient variance and improve device utilization until memory or bandwidth saturates, but they make fewer updates per epoch and can require learning-rate scaling and warmup. Beyond the gradient-noise scale they buy little statistical efficiency, so optimize examples or tokens per second and validation quality, not batch size in isolation.
    priority: common
    difficulty: intermediate
