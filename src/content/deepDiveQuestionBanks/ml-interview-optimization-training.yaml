  - id: q-opt-loss-plateau
    question: 'A training loss plateaus early. What do you check, in what order?'
    conciseAnswer: >-
      First prove the pipeline can overfit one tiny batch, then verify labels, masks, units, train mode, parameter registration and actual parameter updates. Inspect learning rate, gradient and activation norms, loss scale and class balance before increasing capacity; a scheduler cannot fix detached tensors or wrong targets.
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, dl-specialist]
