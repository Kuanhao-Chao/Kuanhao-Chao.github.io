lesson: ml-interview-optimization-training
questions:
  - id: q-opt-gd-sgd-minibatch
    question: 'Compare batch gradient descent, stochastic gradient descent, and mini-batch SGD.'
    conciseAnswer: >-
      Full-batch gradient descent computes an exact dataset gradient but makes expensive, infrequent updates; one-example SGD is cheap and noisy; mini-batches vectorize efficiently while retaining useful gradient noise. In deep learning, mini-batch SGD is the practical default because it balances hardware throughput, memory, update frequency, and generalization.
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: trade-off
    round: knowledge
    stability: evergreen
    tags: [gradient-descent, sgd, minibatch]
    aliases: [batch versus stochastic gradient descent, mini batch]
  - id: q-opt-learning-rate
    question: 'Why is the learning rate usually the most important training hyperparameter?'
    conciseAnswer: >-
      The learning rate converts a gradient into a parameter displacement: too large causes oscillation or divergence, while too small wastes compute and can stall in poorly conditioned directions. Its useful scale depends on curvature, batch size, normalization and optimizer, so diagnose it from loss and update-to-weight behavior rather than from a universal constant.
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: concept
    round: knowledge
    stability: evergreen
    tags: [learning-rate, convergence, curvature]
    aliases: [step size, learning rate tuning]
  - id: q-opt-momentum
    question: 'How do momentum and Nesterov momentum accelerate optimization?'
    conciseAnswer: >-
      Momentum exponentially averages past gradients, damping oscillation in steep directions and accumulating speed in persistent directions. Nesterov evaluates the gradient after a look-ahead step, which provides an earlier correction; exact library conventions differ, so reason from the implemented recurrence before comparing hyperparameters.
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: mathematics
