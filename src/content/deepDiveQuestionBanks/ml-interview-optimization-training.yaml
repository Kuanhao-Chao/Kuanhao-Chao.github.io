  - id: q-opt-tuning
    question: 'How would you tune a deep-learning training recipe efficiently?'
    conciseAnswer: >-
      Establish a reproducible baseline and valid metric, run cheap range or multi-fidelity searches over log-scaled learning rate, regularization and capacity, and inspect learning curves before scaling. Change one subsystem at a time, preserve seeds and configs, promote robust regions rather than lucky points, and retest finalists on untouched data.
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: system-design
    round: experimentation
    stability: evergreen
    tags: [hyperparameters, tuning, reproducibility]
    aliases: [hyperparameter optimization, training recipe]
  - id: q-opt-early-stopping
    question: 'Is early stopping an optimization technique or a regularizer?'
    conciseAnswer: >-
      It is both an optimization control and an implicit regularizer: stopping before full empirical-risk minimization limits how far parameters fit weak or noisy directions. Monitor a prespecified validation metric with sensible evaluation cadence and patience, save the best checkpoint, and avoid repeatedly using the test set to choose the stopping time.
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: concept
