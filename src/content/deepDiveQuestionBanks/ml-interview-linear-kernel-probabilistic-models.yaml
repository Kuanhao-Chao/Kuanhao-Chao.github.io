  - id: q-models-support-vectors-dual
    question: 'Why do only support vectors determine an SVM prediction?'
    conciseAnswer: 'In the dual solution, w is a weighted sum of training examples and complementary slackness makes the multiplier zero for points strictly outside the margin. Only points on or inside the margin retain nonzero multipliers, so predictions depend on their kernel similarities.'
    priority: specialist
    difficulty: advanced
    roles: [applied-scientist, research-scientist]
    kind: mathematics
