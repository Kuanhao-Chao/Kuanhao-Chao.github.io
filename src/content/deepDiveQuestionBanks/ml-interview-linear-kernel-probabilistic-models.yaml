  - id: q-models-lda-qda
    question: 'Derive the difference between LDA and QDA decision boundaries.'
    conciseAnswer: 'Both assume a class-conditional Gaussian. Sharing one covariance matrix makes the quadratic x terms cancel in log-posterior ratios, so LDA has linear boundaries; class-specific covariance matrices retain those terms, giving QDA curved boundaries with many more parameters.'
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist]
    kind: mathematics
    round: knowledge
    stability: evergreen
    tags: [lda, qda, gaussian-classifier]
    aliases: [linear-discriminant-analysis, quadratic-discriminant-analysis]
  - id: q-models-knn
    question: 'What controls the bias, variance, and computational cost of k-nearest neighbors?'
    conciseAnswer: 'Small k creates flexible low-bias, high-variance neighborhoods; larger k smooths predictions and raises bias. Distance scaling, metric choice, dimensionality, and local density determine whether neighbors are meaningful, while naïve inference costs O(nd) per query and stores the training set.'
    priority: common
    difficulty: foundational
    roles: [general-mle, applied-scientist]
    kind: trade-off
    round: knowledge
    stability: evergreen
    tags: [knn, nonparametric, curse-of-dimensionality]
    aliases: [nearest-neighbors, choosing-k]
  - id: q-models-svm-margin
    question: 'What is the geometric margin in an SVM, and why does maximizing it regularize the classifier?'
    conciseAnswer: "For hyperplane w transpose x plus b equals zero, a labeled point's signed geometric margin is y(w transpose x plus b)/||w||. Fixing functional margin constraints and minimizing ||w|| squared maximizes the smallest geometric margin, controlling capacity while hinge-loss slack trades violations against boundary width."
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist]
    kind: mathematics
    round: knowledge
    stability: evergreen
    tags: [svm, margin, hinge-loss, regularization]
    aliases: [maximum-margin, soft-margin-svm]
  - id: q-models-kernel-trick
    question: 'What is the kernel trick, and what makes a function a valid kernel?'
    conciseAnswer: 'A kernel evaluates an inner product in an implicit feature space, letting dual algorithms fit nonlinear boundaries without explicitly constructing those features. On any finite sample its Gram matrix must be symmetric positive semidefinite; a convenient similarity function is not automatically a valid kernel.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist]
    kind: mathematics
    round: knowledge
    stability: evergreen
    tags: [kernels, svm, reproducing-kernel]
    aliases: [implicit-feature-map, mercer-kernel]
  - id: q-models-svm-hyperparameters
    question: 'How do C and gamma change an RBF SVM, and how should they be tuned?'
    conciseAnswer: "C controls the cost of margin violations: large C fits training points more aggressively. RBF gamma controls locality: large gamma makes each point's influence narrow and the boundary wiggly; both must be tuned inside cross-validation after scaling features, preferably on logarithmic grids."
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist]
    kind: trade-off
