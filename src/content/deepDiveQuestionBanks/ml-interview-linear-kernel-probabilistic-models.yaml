lesson: ml-interview-linear-kernel-probabilistic-models
questions:
  - id: q-models-generative-discriminative
    question: 'What is the difference between a generative and a discriminative classifier?'
    conciseAnswer: "A discriminative model learns a decision boundary or p(y|x); a generative model learns p(x|y) together with p(y), then applies Bayes' rule. Generative assumptions can improve sample efficiency and enable missing-data or simulation workflows, while discriminative models usually win asymptotically when their conditional model is well specified."
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, research-scientist]
    kind: concept
    round: knowledge
    stability: evergreen
    tags: [classification, bayes, generative-models]
    aliases: [generative-vs-discriminative, joint-vs-conditional]
  - id: q-models-linear-regression-assumptions
    question: 'What assumptions does ordinary least squares make, and which conclusion does each assumption support?'
    conciseAnswer: 'Linearity in parameters and zero conditional-mean errors make OLS unbiased; full column rank makes the coefficient vector identifiable; finite, homoscedastic, uncorrelated errors make the usual variance formula valid. Normal errors are not needed to fit OLS or prove unbiasedness—they make exact small-sample t and F inference possible.'
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, research-scientist]
    kind: mathematics
    round: knowledge
    stability: evergreen
    tags: [linear-regression, ols, assumptions, inference]
    aliases: [ols-assumptions, gauss-markov]
  - id: q-models-normal-equations
    question: 'Derive the normal equations, and explain why production code should rarely invert X transpose X directly.'
    conciseAnswer: 'Differentiating ||y-Xw|| squared gives X transpose X w = X transpose y. Forming and inverting X transpose X squares the condition number and is numerically fragile; solve least squares with QR, SVD, or an iterative method, using the pseudoinverse when rank deficient.'
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist]
    kind: mathematics
    round: coding
    stability: evergreen
    tags: [linear-regression, numerical-linear-algebra, conditioning]
    aliases: [closed-form-linear-regression, pseudoinverse]
  - id: q-models-ridge-lasso
    question: 'Compare ridge and lasso regularization geometrically, statistically, and computationally.'
    conciseAnswer: 'Ridge adds an L2 penalty, continuously shrinking correlated coefficients and producing a unique stable solution under mild conditions. Lasso adds an L1 penalty whose corners create exact zeros, but selected features can be unstable under collinearity; elastic net combines both behaviors.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist]
    kind: trade-off
    round: knowledge
    stability: evergreen
    tags: [regularization, ridge, lasso, elastic-net]
    aliases: [l1-vs-l2, feature-selection]
  - id: q-models-logistic-loss
    question: 'Why does logistic regression use log loss instead of squared error?'
    conciseAnswer: 'A Bernoulli likelihood with log-odds linear in x yields sigmoid probabilities and binary cross-entropy as the negative log-likelihood. The resulting objective is convex, heavily penalizes confident wrong answers, and estimates conditional probabilities when the model is correctly specified; squared error lacks that likelihood match and has poorer optimization geometry with a sigmoid.'
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: mathematics
    round: knowledge
    stability: evergreen
    tags: [logistic-regression, cross-entropy, maximum-likelihood]
    aliases: [binary-cross-entropy, sigmoid-loss]
  - id: q-models-softmax
    question: 'How does multinomial logistic regression work, and why must softmax be computed with log-sum-exp stabilization?'
    conciseAnswer: 'The model assigns one logit per class and normalizes exponentials into probabilities. Adding or subtracting one constant from every logit changes no probability, so subtracting the maximum logit prevents overflow; log-softmax or log-sum-exp should be fused with cross-entropy in code.'
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, dl-specialist]
    kind: implementation
    round: coding
    stability: evergreen
    tags: [softmax, multiclass, numerical-stability]
    aliases: [multinomial-logistic-regression, log-sum-exp]
  - id: q-models-threshold-calibration
    question: 'Why are probability calibration and decision-threshold selection separate problems?'
    conciseAnswer: 'Calibration asks whether events predicted at probability p occur about p of the time; thresholding converts probabilities into actions using costs, benefits, prevalence, and constraints. A calibrated model can have a poor operating threshold, and a rank-accurate model can be poorly calibrated yet still support a useful threshold after validation.'
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, leadership]
    kind: concept
    round: experimentation
    stability: evergreen
    tags: [calibration, thresholds, decision-theory]
    aliases: [calibration-vs-discrimination, operating-point]
  - id: q-models-naive-bayes
    question: 'Why can naive Bayes work well when conditional independence is false?'
    conciseAnswer: 'Classification needs the correct ordering of posterior scores, not a perfect joint density. Correlated features can distort probability calibration while leaving the winning class unchanged, and the strong factorization assumption reduces estimation variance in small data; duplicated evidence remains a major failure mode.'
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist]
    kind: concept
