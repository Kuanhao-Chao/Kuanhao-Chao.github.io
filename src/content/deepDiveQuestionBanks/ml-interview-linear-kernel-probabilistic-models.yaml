    tags: [svm, duality, support-vectors, kkt]
    aliases: [svm-dual, complementary-slackness]
  - id: q-models-scaling
    question: 'Which classical models require feature scaling, and why?'
    conciseAnswer: 'Distance-based methods, gradient-based optimization, and coefficient penalties are sensitive to units, so kNN, RBF SVMs, PCA, and regularized linear models generally need scaling. Ordinary unregularized predictions are invariant to invertible rescaling after refitting, while tree splits are effectively scale invariant.'
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist]
    kind: implementation
    round: knowledge
    stability: evergreen
    tags: [preprocessing, scaling, leakage]
    aliases: [standardization, normalize-features]
  - id: q-models-interactions-collinearity
    question: 'How do interactions, polynomial features, and multicollinearity change a linear model?'
    conciseAnswer: 'A model is linear because it is linear in its coefficients, so transformed and interaction features can represent curved responses. Correlated columns make individual coefficients unstable and inflate their variance without necessarily hurting prediction; centering, regularization, domain-driven bases, or dimensionality reduction can help.'
    priority: common
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist]
    kind: concept
    round: project-defense
    stability: evergreen
    tags: [feature-engineering, interactions, multicollinearity]
    aliases: [polynomial-regression, correlated-features]
  - id: q-models-imbalance-weights
    question: 'What does class weighting change in a probabilistic classifier?'
    conciseAnswer: 'Weighting changes the empirical risk and usually the effective class prior, emphasizing mistakes on one class. It may improve ranking or recall but its raw outputs need not represent deployment probabilities; evaluate on the natural prevalence and recalibrate or adjust prior odds when probabilities matter.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist]
    kind: trade-off
    round: experimentation
    stability: evergreen
    tags: [class-imbalance, weighting, calibration]
    aliases: [weighted-loss, rare-class]
  - id: q-models-model-choice
    question: 'How would you choose among a linear model, kNN, an SVM, and a probabilistic generative model?'
    conciseAnswer: 'Start from sample size, dimensionality, sparsity, latency, missingness, calibration, and interpretability—not a leaderboard. Use a regularized linear baseline for sparse or explainable problems, kNN for meaningful local geometry and cheap training, kernels for medium-sized nonlinear data, and generative models when their structure or missing-data capabilities are valuable.'
    priority: common
    difficulty: advanced
    roles: [general-mle, applied-scientist, research-scientist, leadership]
    kind: system-design
    round: system-design
    stability: evergreen
    tags: [model-selection, trade-offs, baselines]
    aliases: [which-classifier, classical-model-selection]
