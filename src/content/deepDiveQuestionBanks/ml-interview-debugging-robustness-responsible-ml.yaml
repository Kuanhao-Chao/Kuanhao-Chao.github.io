  - id: q-reliability-differential-privacy
    question: 'What guarantee does differential privacy provide, and what does epsilon mean?'
    conciseAnswer: 'An algorithm is epsilon-delta differentially private when neighboring datasets induce nearly indistinguishable output distributions: probabilities differ by at most a multiplicative exp(epsilon) plus delta. The guarantee limits additional disclosure caused by one record and composes across releases; it does not anonymize the raw data or prevent every inference.'
    priority: common
    difficulty: advanced
