  - id: q-reliability-explanations
    question: 'What do feature-attribution methods explain, and what do they not prove?'
    conciseAnswer: 'They attribute a particular model output relative to a baseline, perturbation distribution, or cooperative-game definition. They do not establish causal effects, data validity, model correctness, or human-understandable mechanism; test fidelity, stability, baseline sensitivity, and usefulness for the concrete decision.'
    priority: must-know
