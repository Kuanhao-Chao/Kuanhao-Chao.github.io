  - id: q-reliability-security-abuse
    question: 'What security and abuse risks belong in an ML launch review?'
    conciseAnswer: 'Model the full attack surface: poisoned or exfiltrated data, dependency compromise, unauthorized model access, extraction/inversion, adversarial inputs, prompt/tool abuse, and harmful legitimate use. Map each threat to access controls, provenance, isolation, rate limits, red-team tests, incident ownership, and a rollback or kill path.'
    priority: common
    difficulty: advanced
    roles: [ml-platform, genai, leadership]
    kind: system-design
    round: system-design
    stability: fast-moving
    verified: 2026-08-22
