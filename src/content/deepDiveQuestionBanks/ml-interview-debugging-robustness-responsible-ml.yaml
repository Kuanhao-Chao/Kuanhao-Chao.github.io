  - id: q-reliability-fairness-definitions
    question: 'Why can common statistical fairness criteria be mutually incompatible?'
    conciseAnswer: 'When base rates differ and prediction is imperfect, calibration within groups and equalized error rates generally cannot both hold. Selecting a criterion is therefore a policy decision tied to harms, legal context, and intervention—not a technical search for the universally fair metric.'
    priority: must-know
