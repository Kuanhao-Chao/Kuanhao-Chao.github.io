  - id: q-reliability-aleatoric-epistemic
    question: 'What are aleatoric and epistemic uncertainty, and when is the distinction useful?'
    conciseAnswer: 'Aleatoric uncertainty represents outcome variability that remains even with the correct parameters and inputs; epistemic uncertainty reflects limited knowledge about the model or data-generating process and can shrink with informative data. The decomposition is model-dependent, so use it to select actions, not as an observed ground-truth partition.'
    priority: common
