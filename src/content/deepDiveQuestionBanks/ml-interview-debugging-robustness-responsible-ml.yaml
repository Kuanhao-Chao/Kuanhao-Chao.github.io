  - id: q-reliability-shift-taxonomy
    question: 'Distinguish covariate shift, label shift, concept drift, and selection bias.'
    conciseAnswer: 'Covariate shift changes p(x) while p(y|x) stays fixed; label shift changes p(y) while p(x|y) stays fixed; concept drift changes p(y|x); selection bias changes which examples are observed. The assumptions overlap imperfectly in real systems, so diagnosis needs causal timing, labels, and slices—not one drift score.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, ml-platform]
    kind: mathematics
