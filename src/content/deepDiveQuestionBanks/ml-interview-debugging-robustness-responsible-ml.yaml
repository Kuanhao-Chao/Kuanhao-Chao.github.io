    aliases: [dataset-shift, covariate-shift]
  - id: q-reliability-ood-detection
    question: 'Why is out-of-distribution detection not a solved binary classification problem?'
    conciseAnswer: 'OOD is defined relative to an intended deployment distribution, while possible alternatives are unbounded and often unavailable during training. A detector can separate one benchmark OOD set yet fail on another, so specify the shift family and action, evaluate multiple near/far shifts, and retain abstention plus monitoring.'
    priority: common
    difficulty: advanced
