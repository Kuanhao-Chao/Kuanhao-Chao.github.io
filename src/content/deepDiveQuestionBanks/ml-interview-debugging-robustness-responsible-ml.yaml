lesson: ml-interview-debugging-robustness-responsible-ml
questions:
  - id: q-reliability-loss-not-decreasing
    question: 'A training loss does not decrease. How do you debug it without guessing?'
    conciseAnswer: 'Reduce the system until one batch can overfit, then verify labels, shapes, loss inputs, gradient flow, parameter updates, numerical ranges, and learning rate in that order. Change one variable at a time and record the first invariant that breaks; broad hyperparameter sweeps hide wiring bugs.'
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: debugging
    round: project-defense
    stability: evergreen
    tags: [training, loss, gradients, debugging]
    aliases: [model-does-not-learn, flat-loss]
  - id: q-reliability-overfit-one-batch
    question: 'Why is overfitting one tiny batch such a powerful diagnostic?'
    conciseAnswer: 'A sufficiently expressive model should nearly memorize a small clean batch. Failure narrows the fault to data/label alignment, model capacity, loss semantics, gradients, optimizer state, or stochastic layers; success clears the core learning path but says nothing about generalization.'
    priority: must-know
    difficulty: foundational
    roles: [general-mle, applied-scientist, dl-specialist]
    kind: debugging
    round: coding
    stability: evergreen
    tags: [sanity-check, memorization, training-loop]
    aliases: [tiny-batch-test, overfit-small-batch]
  - id: q-reliability-train-validation-gap
    question: 'Training performance improves while validation degrades. What hypotheses do you test?'
    conciseAnswer: 'First verify comparable pipelines, split integrity, metric aggregation, and train/eval modes. Then distinguish variance from distribution mismatch by learning curves, subgroup/time slices, repeated splits, and simpler baselines before adding regularization, data, augmentation, or early stopping.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, dl-specialist]
    kind: debugging
    round: experimentation
    stability: evergreen
