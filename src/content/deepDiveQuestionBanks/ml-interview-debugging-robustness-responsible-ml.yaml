    aliases: [silent-data-corruption, label-misalignment]
  - id: q-reliability-gradient-pathologies
    question: 'How do you diagnose vanishing, exploding, and otherwise unhealthy gradients?'
    conciseAnswer: 'Log per-layer activation and gradient norms, nonfinite counts, update-to-weight ratios, saturation, and clipping frequency on a deterministic batch. Use the pattern to test initialization, normalization, residual paths, loss scale, sequence depth, learning rate, and mixed-precision scaling rather than declaring every small gradient vanishing.'
    priority: must-know
    difficulty: intermediate
    roles: [applied-scientist, research-scientist, dl-specialist]
    kind: debugging
    round: coding
    stability: evergreen
    tags: [gradients, activations, numerical-stability]
    aliases: [vanishing-gradients, exploding-gradients]
  - id: q-reliability-calibration-uncertainty
    question: 'How are confidence, calibration, discrimination, and uncertainty different?'
    conciseAnswer: 'A confidence score is a model output; discrimination measures ranking; calibration compares predicted probabilities with empirical frequencies; uncertainty describes unresolved outcome or model knowledge. None guarantees the others, and all are conditional on the evaluated population and decision context.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, research-scientist, leadership]
    kind: concept
