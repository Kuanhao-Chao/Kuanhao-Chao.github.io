    aliases: [generalization-gap, validation-loss-rises]
  - id: q-reliability-data-label-bugs
    question: 'How do you detect silent data and label bugs before blaming the model?'
    conciseAnswer: 'Trace sampled raw records through every transform, assert schemas/ranges/joins and cardinalities, visualize examples with labels, compare feature distributions by split and time, and train leakage-oriented baselines. Version lineage and test invariants at boundaries because plausible tensors can still represent the wrong examples.'
    priority: must-know
    difficulty: intermediate
    roles: [general-mle, applied-scientist, ml-platform]
    kind: debugging
    round: project-defense
    stability: evergreen
