  - id: q-reliability-subgroup-evaluation
    question: 'How do you evaluate subgroup performance without producing noisy or misleading tables?'
    conciseAnswer: 'Predefine harm-relevant and intersectional groups, report denominators and uncertainty, protect privacy, and use hierarchical or multiplicity-aware analysis for sparse slices. Pair aggregate disparities with threshold/label-quality investigation and avoid choosing only favorable slices after seeing results.'
    priority: common
