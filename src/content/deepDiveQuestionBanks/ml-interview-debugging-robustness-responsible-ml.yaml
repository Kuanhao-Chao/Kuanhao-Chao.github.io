  - id: q-reliability-adversarial-threat-model
    question: 'How do you define and evaluate an adversarial-robustness claim?'
    conciseAnswer: 'State attacker knowledge, capabilities, perturbation set, budget, target, and success metric before choosing an attack. Evaluate adaptive attacks against the complete defense, clean/robust utility, and realistic semantic constraints; robustness to one norm and radius does not imply security outside that threat model.'
    priority: common
    difficulty: advanced
    roles: [research-scientist, dl-specialist, ml-platform]
    kind: system-design
