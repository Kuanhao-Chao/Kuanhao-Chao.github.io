    aliases: [ml-threat-model, ai-security]
  - id: q-reliability-launch-decision
    question: 'How do you decide whether a model is responsible and ready to launch?'
    conciseAnswer: 'Translate intended use and foreseeable misuse into measurable acceptance gates across utility, subgroup harms, privacy, security, reliability, human oversight, and reversibility. Record evidence and residual risk in model/data documentation, assign owners, stage exposure, monitor leading indicators, and stop when a critical uncertainty lacks mitigation.'
